name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      force_deploy:
        description: 'Force deploy even without changes'
        required: false
        type: boolean

env:
  REGISTRY: ghcr.io
  ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: true

jobs:
  build-and-push:
    name: Build & Push
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      sha: ${{ steps.meta.outputs.sha }}
    steps:
      - uses: actions/checkout@v4

      # GHCR requires lowercase repository names
      - name: Set lowercase image names
        run: |
          echo "API_IMAGE=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/mtg-explorer-api" >> "$GITHUB_ENV"
          echo "WEB_IMAGE=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/mtg-explorer-web" >> "$GITHUB_ENV"

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Set image metadata
        id: meta
        run: echo "sha=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - name: Build & Push API
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/api/Dockerfile
          push: true
          tags: |
            ${{ env.API_IMAGE }}:${{ steps.meta.outputs.sha }}
            ${{ env.API_IMAGE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build & Push Web
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/web/Dockerfile
          push: true
          tags: |
            ${{ env.WEB_IMAGE }}:${{ steps.meta.outputs.sha }}
            ${{ env.WEB_IMAGE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy
    runs-on: self-hosted
    needs: build-and-push
    environment: production
    steps:
      - uses: actions/checkout@v4
        with:
          path: .
          fetch-depth: 0

      - name: Set variables
        id: vars
        run: |
          echo "sha=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
          echo "owner_lc=$(echo "$GITHUB_REPOSITORY_OWNER" | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"
          if [ -f .current-release ]; then
            echo "prev_sha=$(cat .current-release)" >> "$GITHUB_OUTPUT"
          else
            echo "prev_sha=none" >> "$GITHUB_OUTPUT"
          fi

      - name: Login to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ${{ env.REGISTRY }} -u ${{ github.actor }} --password-stdin

      - name: Deploy
        env:
          RELEASE_SHA: ${{ steps.vars.outputs.sha }}
          OWNER_LC: ${{ steps.vars.outputs.owner_lc }}
        run: |
          echo "PWD: $(pwd)"
          echo "Workspace files: $(ls -a)"
          COMPOSE_FILE=$(find "$GITHUB_WORKSPACE" -maxdepth 3 -name docker-compose.deploy.yml | head -n1)
          echo "Using compose file: $COMPOSE_FILE"
          [ -z "$COMPOSE_FILE" ] && echo "ERROR: docker-compose.deploy.yml not found under $GITHUB_WORKSPACE" && exit 1
          docker compose -f "$COMPOSE_FILE" down
          docker ps -q --filter "publish=3000" | xargs -r docker rm -f || true
          docker ps -q --filter "publish=3001" | xargs -r docker rm -f || true
          for p in 3000 3001; do
            pid=$(sudo ss -ltnp "sport = :$p" 2>/dev/null | grep -oP 'pid=\K[0-9]+' | head -n1)
            [ -n "$pid" ] && sudo kill -9 "$pid" 2>/dev/null || true
          done
          docker compose -f "$COMPOSE_FILE" pull
          docker compose -f "$COMPOSE_FILE" up -d --remove-orphans

      - name: Health check
        run: |
          for i in $(seq 1 12); do
            if curl -sf http://127.0.0.1:3000/health > /dev/null 2>&1; then
              echo "API is healthy"
              exit 0
            fi
            echo "Waiting for API... ($i/12)"
            sleep 5
          done
          echo "API health check failed"
          exit 1

      - name: Record release
        run: echo "${{ steps.vars.outputs.sha }}" > .current-release

      - name: Rollback on failure
        if: failure()
        env:
          PREV_SHA: ${{ steps.vars.outputs.prev_sha }}
          OWNER_LC: ${{ steps.vars.outputs.owner_lc }}
        run: |
          if [ "$PREV_SHA" = "none" ]; then
            echo "No previous release to rollback to"
            exit 1
          fi
          export RELEASE_SHA=$PREV_SHA
          COMPOSE_FILE=$(find "$GITHUB_WORKSPACE" -maxdepth 3 -name docker-compose.deploy.yml | head -n1)
          docker compose -f "$COMPOSE_FILE" down
          docker ps -q --filter "publish=3000" | xargs -r docker rm -f || true
          docker ps -q --filter "publish=3001" | xargs -r docker rm -f || true
          for p in 3000 3001; do
            pid=$(sudo ss -ltnp "sport = :$p" 2>/dev/null | grep -oP 'pid=\K[0-9]+' | head -n1)
            [ -n "$pid" ] && sudo kill -9 "$pid" 2>/dev/null || true
          done
          docker compose -f "$COMPOSE_FILE" pull
          docker compose -f "$COMPOSE_FILE" up -d --remove-orphans
          echo "Rolled back to $PREV_SHA"
