name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      force_deploy:
        description: 'Force deploy even without changes'
        required: false
        type: boolean

env:
  REGISTRY: ghcr.io
  API_IMAGE: ghcr.io/${{ github.repository_owner }}/mtg-explorer-api
  WEB_IMAGE: ghcr.io/${{ github.repository_owner }}/mtg-explorer-web

jobs:
  build-and-push:
    name: Build & Push
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      sha: ${{ steps.meta.outputs.sha }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Set image metadata
        id: meta
        run: echo "sha=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - name: Build & Push API
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/api/Dockerfile
          push: true
          tags: |
            ${{ env.API_IMAGE }}:${{ steps.meta.outputs.sha }}
            ${{ env.API_IMAGE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build & Push Web
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/web/Dockerfile
          push: true
          tags: |
            ${{ env.WEB_IMAGE }}:${{ steps.meta.outputs.sha }}
            ${{ env.WEB_IMAGE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy
    runs-on: self-hosted
    needs: build-and-push
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Set variables
        id: vars
        run: |
          echo "sha=${{ needs.build-and-push.outputs.sha }}" >> "$GITHUB_OUTPUT"
          if [ -f .current-release ]; then
            echo "prev_sha=$(cat .current-release)" >> "$GITHUB_OUTPUT"
          else
            echo "prev_sha=none" >> "$GITHUB_OUTPUT"
          fi

      - name: Login to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ${{ env.REGISTRY }} -u ${{ github.actor }} --password-stdin

      - name: Deploy
        env:
          RELEASE_SHA: ${{ steps.vars.outputs.sha }}
        run: |
          export RELEASE_SHA=${{ steps.vars.outputs.sha }}
          docker compose -f docker-compose.deploy.yml pull
          docker compose -f docker-compose.deploy.yml up -d --remove-orphans

      - name: Health check
        run: |
          for i in $(seq 1 12); do
            if curl -sf http://127.0.0.1:3000/health > /dev/null 2>&1; then
              echo "API is healthy"
              exit 0
            fi
            echo "Waiting for API... ($i/12)"
            sleep 5
          done
          echo "API health check failed"
          exit 1

      - name: Record release
        run: echo "${{ steps.vars.outputs.sha }}" > .current-release

      - name: Rollback on failure
        if: failure()
        env:
          PREV_SHA: ${{ steps.vars.outputs.prev_sha }}
        run: |
          if [ "$PREV_SHA" = "none" ]; then
            echo "No previous release to rollback to"
            exit 1
          fi
          export RELEASE_SHA=$PREV_SHA
          docker compose -f docker-compose.deploy.yml pull
          docker compose -f docker-compose.deploy.yml up -d --remove-orphans
          echo "Rolled back to $PREV_SHA"
