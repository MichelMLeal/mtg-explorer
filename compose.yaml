services:
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - REDIS_URL=redis://redis:6379
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - mtg-network

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    ports:
      - "3001:8080"
    depends_on:
      api:
        condition: service_healthy
    networks:
      - mtg-network

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3
    networks:
      - mtg-network

networks:
  mtg-network:
    driver: bridge
